let me=null,meDoc=null,settings=null,plans=[],gateways=[],campaigns=[],completions=[],myHistory=[],notifications=[],tickets=[],withdraws=[],payments=[],usersCache=[],announcements=[];
let adminTab='Overview',adminLoaded=false,openedTasks={},timers={};
const defaultSettings={actionCost:10,whatsappCost:10,whatsappReward:10,reward:10,signupBonus:50,convertRate:0.0001,minConvertCredits:1000,minWithdraw:5,hiddenInviteGate:true,requiredInvites:5,referralReward:50,referralTrigger:'signup',timerSeconds:45,pendingHours:24,screenshotPct:10,newUserScreenshotTasks:5,verificationMode:'Hybrid',reportWindowHours:24,autoApproveHours:48,strikesToBan:3,retentionDays:7,premiumMultiplier:1.5,dailyBonus:5,affiliatePct:10,affiliateOn:true,currency:'USD',support:{enabled:true,label:'Contact Support',subtext:'Get help from our team',platform:'WhatsApp',link:''},withdrawMethods:{PayPal:true,Payoneer:true,JazzCash:true,Easypaisa:true,Bank:true},ads:{banner:{enabled:false,text:'Your ad here'},infeed:{enabled:false,text:'Your ad here'},earn:{enabled:false,text:'Your ad here'}},codeMinLength:4,codeChangeLimit:2,codeCooldownDays:30,ipRule:true,deviceRule:true,autoBan:false,autoLive:true};

 {name:'PayPal (Simulated)',mode:'Auto',provider:'PayPal',feePct:0,min:1,max:1000,currency:'USD',enabled:true,order:2,isDefault:false,testMode:true}
];
async function ensureSettings(){ const r=await getDoc(doc(db,'settings','app')); if(!r.exists()){ await setDoc(doc(db,'settings','app'),defaultSettings); settings=defaultSettings; await seedPlansGateways(); } else settings={...defaultSettings,...r.data()}; }
async function seedPlansGateways(){ const p=await getDocs(collection(db,'plans')); if(p.empty) for(const x of defaultPlans) await addDoc(collection(db,'plans'),x); const g=await getDocs(collection(db,'gateways')); if(g.empty) for(const x of defaultGateways) await addDoc(collection(db,'gateways'),x); }
async function loadPublic(){ onSnapshot(collection(db,'plans'),s=>{plans=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0)); render();});
 onSnapshot(collection(db,'gateways'),s=>{gateways=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));});
 onSnapshot(query(collection(db,'campaigns'),orderBy('createdAt','desc'),limit(200)),s=>{campaigns=s.docs.map(d=>({id:d.id,...d.data()})); activateScheduled(); render();});
 onSnapshot(query(collection(db,'announcements'),orderBy('createdAt','desc'),limit(5)),s=>{announcements=s.docs.map(d=>({id:d.id,...d.data()})); renderAnn();});
}
async function activateScheduled(){ for(const c of campaigns){ if(c.status==='Scheduled' && c.startAt && c.startAt<=now()) await updateDoc(doc(db,'campaigns',c.id),{status:'Live'}); } }
async function addHistory(uid,type,detail,creditsDelta,cashDelta,balanceAfter,status){ await addDoc(collection(db,'history'),{uid,type,detail,creditsDelta:creditsDelta||0,cashDelta:cashDelta||0,balanceAfter:balanceAfter||null,status:status||'',createdAt:now()}); }
async function releasePending(){ if(!meDoc) return; const q=query(collection(db,'completions'),where('earnerUid','==',me.uid),where('status','==','Pending')); const s=await getDocs(q); for(const d of s.docs){ const c=d.data(); if(c.releaseAt && c.releaseAt<=now() && !c.reported){ await updateDoc(doc(db,'completions',d.id),{status:'Released'}); await updateDoc(doc(db,'users',me.uid),{creditsPending:increment(-c.reward),creditsAvailable:increment(c.reward)}); await addHistory(me.uid,'task_release','Pending credits released: '+(c.campaignTitle||''),c.reward,0,null,'Released'); } } }
async function autoApproveOwner(){ if(!meDoc) return; const q=query(collection(db,'completions'),where('status','==','AwaitingOwnerApproval')); const s=await getDocs(q); for(const d of s.docs){ const c=d.data(); if(c.createdAt && now()-c.createdAt>(settings.autoApproveHours||48)*3600000){ await updateDoc(doc(db,'completions',d.id),{status:'Pending',releaseAt:now()+(settings.pendingHours||24)*3600000}); } } }

function currentPage(){ const h=location.hash||'#/loop'; if(h.startsWith('#/KinzauraPanel')) return 'admin'; if(h.startsWith('#/admin')){location.hash='#/loop';return 'loop';} return h.replace('#/','').split('?')[0]||'loop'; }
window.showPage=p=>{location.hash='#/'+p;};
function render(){ const p=currentPage(); document.querySelectorAll('#bottomNav button').forEach(b=>b.classList.remove('on'));
 const ab=$('authBtn'); if(ab){ ab.textContent=me?'Sign out':'Sign in'; }
 if(!authReady){ $('page').innerHTML='<div class="card">Loading your account...</div>'; return; }
 if(!me){ renderLogin(); return; }
 if(!meDoc){ $('page').innerHTML='<div class="card">Loading your account...</div>'; return; }
 if(p==='admin'){ renderAdmin(); return; }
 if(p==='loop') renderLoop(); else if(p==='promote') renderPromote(); else if(p==='plans') renderPlans(); else if(p==='refer') renderRefer(); else if(p==='wallet') renderWallet(); else if(p==='support') renderSupport(); else if(p==='settings') renderSettings(); else if(p==='install') renderInstall(); else if(p==='leaderboard') renderLeaderboard(); else if(p==='notifications') renderNotifications(); else renderLoop();
 const b=$('balTop'); if(b&&meDoc) b.textContent=fmt(meDoc.creditsAvailable||0)+' credits | '+money(meDoc.cashBalance||0);
 const bell=$('bellCount'); if(bell){ const n=notifications.filter(x=>!x.read).length; bell.style.display=n?'':'none'; bell.textContent=n; }
}

function renderLogin(){ $('page').innerHTML='<div class="card"><h2>Welcome to BoostLoop</h2><p class="muted">Follow. Earn. Grow. Repeat. Sign in with Google only. First sign-in creates your account and gives you '+ (settings?settings.signupBonus:50) +' free credits.</p><button class="btn" onclick="googleLogin()">Continue with Google</button><p class="small">No email or password sign-in is offered. A real public IP is not visible to a website from the browser; device fingerprinting is used for the device rule.</p><div class="row"><button class="btn2" onclick="showPagePublic(\'install\')">Install App</button></div></div>'; }
window.showPagePublic=p=>{location.hash='#/'+p; render();};

 return '<div class="card"><div class="row" style="justify-content:space-between"><b>'+esc(c.title||c.platform+' '+c.action)+'</b><span>'+esc(c.status||'')+'</span></div><p class="muted">'+esc(c.platform)+' &middot; '+esc(c.action)+' &middot; '+(c.delivered||0)+' / '+(c.target||0)+'</p>'+openBtn+' <button class="btn2" onclick="copyLink(\''+esc(c.link)+'\')">Copy Link</button><p class="small" style="word-break:break-all">'+esc(c.link)+'</p>'+(c.quality==='Premium'?'<span class="tag prem">Premium</span> ':'')+(c.country&&c.country!=='All Countries'?'<span class="tag">'+esc(c.country)+'</span> ':'')+(c.delivery==='Drip'?'<span class="tag">Drip '+(c.dripPerDay||0)+'/day &middot; today '+(c.deliveredToday||0)+'</span> ':'')+'<span class="tag">'+fmt(cost)+' credits</span>'+(forEarn?'<div style="margin-top:10px">'+earnControls(c)+'</div>':'')+'</div>'; }

 const opened=openedTasks[c.id]||0; const left=Math.max(0,(settings.timerSeconds||45)-Math.floor((now()-opened)/1000)); const needAudit=meDoc.taskCount<(settings.newUserScreenshotTasks||5)||Math.abs(hashStr(me.uid+c.id))%100<(settings.screenshotPct||10);
 return '<p class="muted">Step 1: Open the link above. Step 2: wait '+ (settings.timerSeconds||45) +' seconds. Step 3: enter the handle you used and claim.</p>'+(opened?'<p>Timer: '+(left>0?left+'s remaining':'Ready to claim')+'</p>':'')+'<label>Username / handle you used</label><input id="handle-'+c.id+'" placeholder="e.g. yourname"><label>Screenshot '+(needAudit||settings.verificationMode==='Screenshot Always'?'(required)':'(only if asked)')+'</label><input type="file" accept="image/*" id="shot-'+c.id+'"><button class="btn" '+(opened&&left<=0?'':'disabled')+' onclick="claimTask(\''+c.id+'\','+(needAudit||settings.verificationMode==='Screenshot Always')+')">Claim '+(c.costPerAction||settings.reward)+' credits</button>'; }
function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return Math.abs(h);}
async function compressImage(file){ if(!file) return ''; return new Promise(res=>{ const img=new Image(); const url=URL.createObjectURL(file); img.onload=()=>{ const scale=Math.min(1,800/Math.max(img.width,img.height)); const cv=document.createElement('canvas'); cv.width=img.width*scale; cv.height=img.height*scale; cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); res(cv.toDataURL('image/jpeg',0.7)); }; img.onerror=()=>res(''); img.src=url; }); }
window.claimTask=async(id,needShot)=>{ const c=campaigns.find(x=>x.id===id); if(!c) return; const handle=$('handle-'+id).value.trim(); if(!handle){alert('Enter the username / handle you used.');return;} const file=$('shot-'+id).files[0]; if(needShot&&!file){alert('A screenshot is required for this task.');return;} const shot=await compressImage(file); const reward=c.costPerAction||settings.reward||10; let status='Pending',releaseAt=now()+(settings.pendingHours||24)*3600000; if(settings.verificationMode==='Screenshot Always') status='Under Review'; if(settings.verificationMode==='Owner Approval') status='AwaitingOwnerApproval';
 await addDoc(collection(db,'completions'),{campaignId:id,campaignTitle:c.title,platform:c.platform,action:c.action,ownerUid:c.ownerUid,earnerUid:me.uid,earnerName:meDoc.name,handle,shot:shot||'',reward,status,retentionStatus:'Pending',createdAt:now(),releaseAt,reported:false});
 await updateDoc(doc(db,'campaigns',id),{delivered:(c.delivered||0)+1,deliveredToday:(c.deliveredToday||0)+1,status:((c.delivered||0)+1>=(c.target||0))?'Completed':c.status});

window.createCampaign=async()=>{ const p=$('cp').value,a=$('ca').value,link=$('clink').value.trim(),title=$('ctitle').value.trim()||(p+' '+a),qty=parseInt($('cqty').value||0); if(!link||!validLink(p,a,link)){ $('linkErr').innerHTML='<div class="err">Enter a valid '+PLATFORMS[p].label+' for '+a+'.</div>'; return; } if(!qty||qty<1){alert('Enter a valid quantity.');return;} let per=p==='WhatsApp'?settings.whatsappCost:settings.actionCost; if($('cquality').value==='Premium') per=Math.ceil(per*(settings.premiumMultiplier||1.5)); const total=per*qty; const plan=plans.find(x=>x.id===meDoc.planId)||plans[0]; const active=campaigns.filter(c=>c.ownerUid===me.uid&&['Live','Paused','Scheduled'].includes(c.status)).length; if(plan&&active>=(plan.maxCampaigns||2)){alert('Your plan allows '+(plan.maxCampaigns||2)+' active campaigns.');return;} if(plan&&qty>(plan.maxQty||50)){alert('Your plan allows up to '+(plan.maxQty||50)+' per campaign.');return;} if((meDoc.creditsAvailable||0)<total){alert('Not enough credits. Total '+total+', balance '+(meDoc.creditsAvailable||0)+'. Earn or buy credits first.');return;}
 const sched=$('csched').value; await addDoc(collection(db,'campaigns'),{ownerUid:me.uid,ownerName:meDoc.name,platform:p,action:a,link,title,target:qty,delivered:0,deliveredToday:0,costPerAction:per,heldCredits:total,delivery:$('cdelivery').value,dripPerDay:parseInt($('cdrip').value||5),startAt:sched?new Date(sched).getTime():null,status:sched?'Scheduled':(settings.autoLive?'Live':'Pending Review'),country:$('ccountry').value,language:$('clang').value,quality:$('cquality').value,createdAt:now()});

function renderNotifications(){ $('page').innerHTML='<div class="card"><h2>Notifications</h2><button class="btn2" onclick="markAllRead()">Mark All Read</button>'+notifications.map(n=>'<p>'+esc(n.text)+' - '+new Date(n.createdAt).toLocaleString()+'</p>').join('')+'</div>'; }
window.markAllRead=async()=>{ for(const n of notifications) if(!n.read) await updateDoc(doc(db,'notifications',n.id),{read:true}); render(); };
async function loadAdmin(){ if(adminLoaded) return; adminLoaded=true; const cols=['users','campaigns','completions','withdraws','payments','tickets','attempts','bans','whitelist','history']; for(const col of cols){ onSnapshot(collection(db,col),s=>{ const arr=s.docs.map(d=>({id:d.id,...d.data()})); if(col==='users') usersCache=arr; if(col==='withdraws') withdraws=arr; if(col==='payments') payments=arr; if(col==='tickets') tickets=arr; renderAdmin(); }); } }
function csvDownload(name,rows){ const csv=rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n'); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=name; a.click(); }
window.setAdminTab=t=>{adminTab=t; renderAdmin();};
window.saveSetting=async(k,v)=>{ await updateDoc(doc(db,'settings','app'),{[k]:v}); settings[k]=v; alert('Saved: '+k); };
function renderAdmin(){ loadAdmin(); const tabs=['Overview','Users','Campaigns','Verification','Earning & Withdraw','Referrals','Plans','Gateways','Ads','Security','History']; let body='';
 if(adminTab==='Overview'){ const rev=payments.filter(p=>p.status==='Paid').reduce((a,p)=>a+(p.amount||0),0); const paidOut=withdraws.filter(w=>w.status==='Paid').reduce((a,w)=>a+(w.amount||0),0); body='<div class="card"><h2>Admin Overview</h2><p>Users: '+usersCache.length+' &middot; Live campaigns: '+campaigns.filter(c=>c.status==='Live').length+' &middot; Credits in circulation: '+fmt(usersCache.reduce((a,u)=>a+(u.creditsAvailable||0)+(u.creditsPending||0),0))+' &middot; Pending withdraws: '+withdraws.filter(w=>w.status==='Pending').length+'</p><h3>Revenue</h3><p>Total revenue: '+money(rev)+' &middot; Total paid out: '+money(paidOut)+' &middot; Net: '+money(rev-paidOut)+'</p><p>Revenue by gateway: '+[...new Set(payments.filter(p=>p.status==='Paid').map(p=>p.gatewayName))].map(g=>g+': '+money(payments.filter(p=>p.status==='Paid'&&p.gatewayName===g).reduce((a,p)=>a+(p.amount||0),0))).join(', ')+'</p><div class="err"><b>Security note:</b> A secret URL is hiding, not locking. At launch, restrict admin data to a designated admin Google account in Firestore rules, and rotate the secret route word. Anyone who learns the secret route can open Admin in this prototype build.</div><label>Announcement to all users</label><input id="annText"><button class="btn" onclick="sendAnnouncement()">Send announcement</button></div>'; }
 else if(adminTab==='Users'){ body='<div class="card"><h2>Users</h2>'+usersCache.map(u=>'<p>'+esc(u.name)+' ('+esc(u.email)+') - '+fmt(u.creditsAvailable||0)+' credits, invites '+(u.invites||0)+', strikes '+(u.strikes||0)+', device '+(u.deviceId||'')+' <button class="btn2" onclick="banUser(\''+u.id+'\')">Ban</button> <button class="btn2" onclick="banAllLinked(\''+u.id+'\')">Ban All Linked</button></p>').join('')+'</div>'; }
 else if(adminTab==='Campaigns'){ body='<div class="card"><h2>Campaigns</h2>'+campaigns.map(c=>campaignCard(c,false)+'<div class="row"><button class="btn2" onclick="adminCampaign(\''+c.id+'\',\'Live\')">Approve</button><button class="btn2" onclick="adminCampaign(\''+c.id+'\',\'Paused\')">Pause</button><button class="btn2" onclick="adminCampaign(\''+c.id+'\',\'Completed\')">Force Complete</button><button class="btn2" onclick="adminCampaign(\''+c.id+'\',\'Deleted\')">Delete</button></div>').join('')+'</div>'; }
 else if(adminTab==='Verification'){ const q=completions.filter(c=>c.status==='Under Review'||c.reported); body='<div class="card"><h2>Verification</h2><label>Mode</label><select id="vMode" onchange="saveSetting(\'verificationMode\',this.value)"><option'+(settings.verificationMode==='Hybrid'?' selected':'')+'>Hybrid</option><option'+(settings.verificationMode==='Timer+Self Confirm'?' selected':'')+'>Timer+Self Confirm</option><option'+(settings.verificationMode==='Screenshot Always'?' selected':'')+'>Screenshot Always</option><option'+(settings.verificationMode==='Owner Approval'?' selected':'')+'>Owner Approval</option></select><label>Timer seconds</label><input type="number" id="vTimer" value="'+settings.timerSeconds+'"><button class="btn2" onclick="saveSetting(\'timerSeconds\',parseInt($(\'vTimer\').value))">Save timer</button><label>Pending hours</label><input type="number" id="vPend" value="'+settings.pendingHours+'"><button class="btn2" onclick="saveSetting(\'pendingHours\',parseInt($(\'vPend\').value))">Save pending hours</button><label>Screenshot %</label><input type="number" id="vShot" value="'+settings.screenshotPct+'"><button class="btn2" onclick="saveSetting(\'screenshotPct\',parseInt($(\'vShot\').value))">Save %</button><label>Retention days</label><input type="number" id="vRet" value="'+settings.retentionDays+'"><button class="btn2" onclick="saveSetting(\'retentionDays\',parseInt($(\'vRet\').value))">Save retention</button><h3>Review queue</h3>'+q.map(c=>'<p>'+esc(c.earnerName)+' - '+esc(c.campaignTitle)+' - '+esc(c.handle)+' '+(c.shot?'<a target="_blank" href="'+c.shot+'">Screenshot</a>':'')+' <button class="btn2" onclick="reviewCompletion(\''+c.id+'\',true)">Approve</button> <button class="btn2" onclick="reviewCompletion(\''+c.id+'\',false)">Reject</button></p>').join('')+'</div>'; }
 else if(adminTab==='Earning & Withdraw'){ body='<div class="card"><h2>Earning & Withdraw</h2><label>Action cost / reward</label><input type="number" id="eCost" value="'+settings.actionCost+'"><button class="btn2" onclick="saveSetting(\'actionCost\',parseInt($(\'eCost\').value))">Save</button><label>Convert rate (cash per 1 credit, 0.0001 = 1000 for $0.10)</label><input type="number" step="0.0001" id="eRate" value="'+settings.convertRate+'"><button class="btn2" onclick="saveSetting(\'convertRate\',parseFloat($(\'eRate\').value))">Save</button><label>Minimum convert credits</label><input type="number" id="eMinC" value="'+settings.minConvertCredits+'"><button class="btn2" onclick="saveSetting(\'minConvertCredits\',parseInt($(\'eMinC\').value))">Save</button><label>Minimum withdraw $</label><input type="number" id="eMinW" value="'+settings.minWithdraw+'"><button class="btn2" onclick="saveSetting(\'minWithdraw\',parseFloat($(\'eMinW\').value))">Save</button><label>Required invites for withdraw (hidden gate)</label><input type="number" id="eInv" value="'+settings.requiredInvites+'"><button class="btn2" onclick="saveSetting(\'requiredInvites\',parseInt($(\'eInv\').value))">Save</button><h3>Withdraw requests</h3>'+withdraws.map(w=>'<p>'+esc(w.userName)+' - '+esc(w.walletMethod)+' '+esc(w.walletAddress)+' - '+money(w.amount)+' - invites '+(w.invites||0)+' - '+esc(w.status)+' <button class="btn2" onclick="withdrawAction(\''+w.id+'\',\'Approved\')">Approve</button> <button class="btn2" onclick="withdrawAction(\''+w.id+'\',\'Paid\')">Mark Paid</button> <button class="btn2" onclick="withdrawAction(\''+w.id+'\',\'Rejected\')">Reject</button></p>').join('')+'</div>'; }
 else if(adminTab==='Referrals'){ body='<div class="card"><h2>Referrals</h2><label>Referral reward credits</label><input type="number" id="rRew" value="'+settings.referralReward+'"><button class="btn2" onclick="saveSetting(\'referralReward\',parseInt($(\'rRew\').value))">Save</button><label>Affiliate %</label><input type="number" id="rAff" value="'+settings.affiliatePct+'"><button class="btn2" onclick="saveSetting(\'affiliatePct\',parseInt($(\'rAff\').value))">Save</button><p>Total invites: '+usersCache.reduce((a,u)=>a+(u.invites||0),0)+'</p></div>'; }
 else if(adminTab==='Plans'){ body='<div class="card"><h2>Plans</h2>'+plans.map(p=>'<p><b>'+esc(p.name)+'</b> - '+money(p.price)+' - '+fmt(p.credits)+' credits - '+(p.enabled?'Enabled':'Disabled')+' <button class="btn2" onclick="togglePlan(\''+p.id+'\','+!p.enabled+')">Toggle</button> <button class="btn2" onclick="duplicatePlan(\''+p.id+'\')">Duplicate</button> '+(p.system?'':'<button class="btn2" onclick="deletePlan(\''+p.id+'\')">Delete</button>')+'</p>').join('')+'<h3>Create plan</h3><label>Name</label><input id="plName"><label>Price</label><input type="number" id="plPrice" value="4.99"><label>Credits</label><input type="number" id="plCredits" value="500"><button class="btn" onclick="createPlan()">Create Plan</button></div>'; }
 else if(adminTab==='Gateways'){ body='<div class="card"><h2>Gateways</h2>'+gateways.map(g=>'<p><b>'+esc(g.name)+'</b> - '+esc(g.mode)+' - fee '+(g.feePct||0)+'% - '+(g.enabled?'Enabled':'Disabled')+' <button class="btn2" onclick="toggleGateway(\''+g.id+'\','+!g.enabled+')">Toggle</button></p>').join('')+'<h3>Create gateway</h3><label>Mode (first field)</label><select id="gwMode" onchange="toggleGwFields()"><option>Manual</option><option>Auto</option></select><div id="gwManual"><label>Gateway name</label><input id="gwName"><label>Instructions shown to user</label><textarea id="gwInstr"></textarea><label>Account label</label><input id="gwAccL" value="Account"><label>Account value</label><input id="gwAccV"></div><div id="gwAuto" style="display:none"><label>Provider preset</label><select id="gwProv"><option>Stripe</option><option>PayPal</option><option>JazzCash API</option><option>Easypaisa API</option><option>Custom API</option></select><label>API Key (admin only)</label><input id="gwKey"><label>API Secret (admin only)</label><input id="gwSec"><label>Webhook URL</label><input id="gwHook"><label>API Base URL / Endpoint (optional)</label><input id="gwBase"></div><label>Fee %</label><input type="number" id="gwFee" value="0"><button class="btn" onclick="createGateway()">Create Gateway</button></div>'; }
 else if(adminTab==='Ads'){ body='<div class="card"><h2>Ads</h2><p>Banner, in-feed and earn-page slots are edited in the settings document. Use the text fields in Firestore settings for ad text, and toggle them here by saving the settings document.</p><p>Banner enabled: '+(settings.ads.banner.enabled?'Yes':'No')+' - '+esc(settings.ads.banner.text)+'</p><p>In-feed enabled: '+(settings.ads.infeed.enabled?'Yes':'No')+' - '+esc(settings.ads.infeed.text)+'</p><p>Earn enabled: '+(settings.ads.earn.enabled?'Yes':'No')+' - '+esc(settings.ads.earn.text)+'</p></div>'; }
 else if(adminTab==='Security'){ body='<div class="card"><h2>Security</h2><p>IP rule: '+(settings.ipRule?'On':'Off')+' &middot; Device rule: '+(settings.deviceRule?'On':'Off')+' &middot; Auto-ban: '+(settings.autoBan?'On':'Off')+'</p><h3>Support button</h3><label>Enabled</label><select id="supEn" onchange="saveSupport()"><option value="true"'+(settings.support.enabled?' selected':'')+'>On</option><option value="false"'+(!settings.support.enabled?' selected':'')+'>Off</option></select><label>Button label</label><input id="supLabel" value="'+esc(settings.support.label)+'"><label>Subtext</label><input id="supSub" value="'+esc(settings.support.subtext)+'"><label>Platform</label><select id="supPlat"><option'+(settings.support.platform==='WhatsApp'?' selected':'')+'>WhatsApp</option><option'+(settings.support.platform==='Telegram'?' selected':'')+'>Telegram</option><option'+(settings.support.platform==='Facebook Messenger'?' selected':'')+'>Facebook Messenger</option><option'+(settings.support.platform==='Email'?' selected':'')+'>Email</option><option'+(settings.support.platform==='Custom Link'?' selected':'')+'>Custom Link</option></select><label>Support link (full https:// URL or mailto:)</label><input id="supLink" value="'+esc(settings.support.link)+'"><div id="supErr"></div><button class="btn" onclick="saveSupport()">Save support settings</button><div style="margin-top:10px"><b>Live preview:</b> '+(settings.support.enabled&&settings.support.link?'<a class="supportBtn" target="_blank" href="'+esc(settings.support.link)+'">'+esc(settings.support.label)+'<div style="font-weight:400;font-size:13px">'+esc(settings.support.subtext)+'</div></a>':'<p class="muted">Button is hidden until it is enabled and a link is saved.</p>')+'</div></div>'; }
 else if(adminTab==='History'){ body='<div class="card"><h2>Global History</h2><button class="btn2" onclick="exportCSV(\'users\')">Export Users CSV</button> <button class="btn2" onclick="exportCSV(\'campaigns\')">Export Campaigns CSV</button> <button class="btn2" onclick="exportCSV(\'payments\')">Export Payments CSV</button> <button class="btn2" onclick="exportCSV(\'withdraws\')">Export Withdrawals CSV</button> <button class="btn2" onclick="exportCSV(\'history\')">Export Full History CSV</button><table><tr><th>User</th><th>Type</th><th>Detail</th><th>Credits</th><th>Status</th></tr>'+myHistory.slice(0,100).map(h=>'<tr><td>'+esc(h.uid||'')+'</td><td>'+esc(h.type)+'</td><td>'+esc(h.detail)+'</td><td>'+(h.creditsDelta||0)+'</td><td>'+esc(h.status||'')+'</td></tr>').join('')+'</table></div>'; }
 $('page').innerHTML='<div class="tabs">'+tabs.map(t=>'<button class="'+(t===adminTab?'on':'')+'" onclick="setAdminTab(\''+t+'\')">'+t+'</button>').join('')+'</div>'+body;
}
window.toggleGwFields=()=>{ $('gwManual').style.display=$('gwMode').value==='Manual'?'':'none'; $('gwAuto').style.display=$('gwMode').value==='Auto'?'':'none'; };
window.saveSupport=async()=>{ const link=$('supLink').value.trim(); if(link&&!(link.startsWith('https://')||link.startsWith('mailto:'))){ $('supErr').innerHTML='<div class="err">Support link is not valid. Paste a full URL (https://...) or an email link (mailto:...).</div>'; return; } const sup={enabled:$('supEn').value==='true',label:$('supLabel').value,subtext:$('supSub').value,platform:$('supPlat').value,link}; await updateDoc(doc(db,'settings','app'),{support:sup}); settings.support=sup; alert('Support settings saved.'); renderAdmin(); };
window.sendAnnouncement=async()=>{ const t=$('annText').value.trim(); if(!t) return; await addDoc(collection(db,'announcements'),{text:t,createdAt:now()}); alert('Announcement sent.'); };
window.banUser=async id=>{ await updateDoc(doc(db,'users',id),{banned:true}); alert('User banned.'); };
window.banAllLinked=async id=>{ const u=usersCache.find(x=>x.id===id); if(!u) return; for(const x of usersCache.filter(y=>y.deviceId===u.deviceId)) await updateDoc(doc(db,'users',x.id),{banned:true}); alert('All linked accounts banned.'); };
window.adminCampaign=async(id,st)=>{ if(st==='Deleted'){ await updateDoc(doc(db,'campaigns',id),{status:'Deleted'}); } else await updateDoc(doc(db,'campaigns',id),{status:st}); };
window.reviewCompletion=async(id,ok)=>{ const c=completions.find(x=>x.id===id); if(!c) return; if(ok){ await updateDoc(doc(db,'completions',id),{status:'Pending',releaseAt:now()+(settings.pendingHours||24)*3600000,reported:false}); await updateDoc(doc(db,'users',c.earnerUid),{creditsPending:increment(c.reward)}); } else { await updateDoc(doc(db,'completions',id),{status:'Rejected'}); await updateDoc(doc(db,'users',c.earnerUid),{strikes:increment(1)}); const u=await getDoc(doc(db,'users',c.earnerUid)); if(u.exists()&&((u.data().strikes||0)+1)>=(settings.strikesToBan||3)) await updateDoc(doc(db,'users',c.earnerUid),{banned:true,earningBanned:true}); } renderAdmin(); };
window.withdrawAction=async(id,st)=>{ const w=withdraws.find(x=>x.id===id); if(!w) return; await updateDoc(doc(db,'withdraws',id),{status:st}); if(st==='Rejected'){ await updateDoc(doc(db,'users',w.uid),{cashBalance:increment(w.amount)}); await addHistory(w.uid,'withdraw','Withdraw rejected, refunded: '+w.walletMethod,-0,w.amount,null,'Refunded'); } if(st==='Paid') await addHistory(w.uid,'withdraw','Withdraw paid: '+w.walletMethod,0,0,null,'Paid'); };
window.togglePlan=async(id,en)=>{ await updateDoc(doc(db,'plans',id),{enabled:en}); };
window.duplicatePlan=async id=>{ const p=plans.find(x=>x.id===id); const c={...p}; delete c.id; c.name=p.name+' Copy'; await addDoc(collection(db,'plans'),c); };
window.deletePlan=async id=>{ const p=plans.find(x=>x.id===id); if(p.system){alert('Free is a system plan and cannot be deleted.');return;} await updateDoc(doc(db,'plans',id),{enabled:false,deleted:true}); };
window.createPlan=async()=>{ await addDoc(collection(db,'plans'),{name:$('plName').value||'New Plan',price:parseFloat($('plPrice').value||0),currency:'USD',credits:parseInt($('plCredits').value||0),duration:'30 days',maxCampaigns:5,maxQty:200,dailyTaskLimit:50,features:[],badge:'none',enabled:true,order:99}); alert('Plan created.'); };
window.toggleGateway=async(id,en)=>{ await updateDoc(doc(db,'gateways',id),{enabled:en}); };
window.createGateway=async()=>{ const mode=$('gwMode').value; const g={name:$('gwName').value||'New Gateway',mode,feePct:parseFloat($('gwFee').value||0),currency:'USD',enabled:true,order:99,isDefault:false}; if(mode==='Manual'){g.instructions=$('gwInstr').value; g.accountLabel=$('gwAccL').value; g.accountValue=$('gwAccV').value;} else {g.provider=$('gwProv').value; g.apiKey=$('gwKey').value; g.apiSecret=$('gwSec').value; g.webhookUrl=$('gwHook').value; g.apiBaseUrl=$('gwBase').value;} await addDoc(collection(db,'gateways'),g); alert('Gateway created. API fields are admin-only and are never rendered to non-admin users.'); };
window.exportCSV=k=>{ if(k==='users') csvDownload('users.csv',[['name','email','credits','invites','strikes'],...usersCache.map(u=>[u.name,u.email,u.creditsAvailable,u.invites,u.strikes])]); if(k==='campaigns') csvDownload('campaigns.csv',[['title','platform','target','delivered','status'],...campaigns.map(c=>[c.title,c.platform,c.target,c.delivered,c.status])]); if(k==='payments') csvDownload('payments.csv',[['user','plan','gateway','amount','status'],...payments.map(p=>[p.userName,p.planName,p.gatewayName,p.amount,p.status])]); if(k==='withdraws') csvDownload('withdrawals.csv',[['user','method','amount','status'],...withdraws.map(w=>[w.userName,w.walletMethod,w.amount,w.status])]); if(k==='history') csvDownload('history.csv',[['uid','type','detail','credits','status'],...myHistory.map(h=>[h.uid,h.type,h.detail,h.creditsDelta,h.status])]); };
window.googleLogin=async()=>{ try{ await setPersistence(auth,browserLocalPersistence); await signInWithPopup(auth,new GoogleAuthProvider()); }catch(e){ showErr('Google sign-in failed: '+e.message); } };
window.headerAuth=async()=>{ if(me){ await signOutUser(); } else { await googleLogin(); } };
window.signOutUser=async()=>{ await signOut(auth); location.hash='#/loop'; render(); };
onAuthStateChanged(auth,async user=>{ authReady=true; me=user; if(!user){meDoc=null; render(); return;} try{ await ensureSettings(); await loadPublic(); const ref=new URLSearchParams(location.search).get('ref'); const uref=await getDoc(doc(db,'users',user.uid)); if(!uref.exists()){ const deviceId=getDeviceId(); const dup=await getDocs(query(collection(db,'users'),where('deviceId','==',deviceId))); let blocked=false,matched=null; if(!dup.empty&&settings.deviceRule){ const other=dup.docs.find(d=>d.id!==user.uid); if(other){ const wl=await getDocs(query(collection(db,'whitelist'),where('deviceId','==',deviceId))); if(wl.empty){ blocked=true; matched=other.data(); await addDoc(collection(db,'attempts'),{attemptedEmail:user.email,attemptedName:user.displayName,deviceId,userAgent:navigator.userAgent,matchedUid:other.id,reason:'Same Device',status:'Blocked',createdAt:now()}); } } }
 if(blocked){ showModal('<h2>Account Blocked</h2><p>Your device is already linked to another account. Creating a second account is not allowed. If you continue, all your accounts will be banned.</p>'+supportHTML()); meDoc={name:user.displayName,email:user.email,blocked:true,creditsAvailable:0}; render(); return; }
 const code=(user.displayName||'user').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,8)+(Math.floor(1000+Math.random()*9000)); let referredBy=null,invitesFrom=null; if(ref){ const q=await getDocs(query(collection(db,'users'),where('referralCode','==',ref))); if(!q.empty){ referredBy=q.docs[0].id; } }
 meDoc={uid:user.uid,name:user.displayName||'',email:user.email||'',photo:user.photoURL||'',referralCode:code,referredBy,deviceId,userAgent:navigator.userAgent,creditsAvailable:settings.signupBonus||50,creditsPending:0,creditsHeld:0,cashBalance:0,invites:0,referralCredits:0,taskCount:0,tasksCompleted:0,creditsEarned:0,strikes:0,streak:0,lastBonusDate:'',codeChanges:0,createdAt:now(),banned:false}; await setDoc(doc(db,'users',user.uid),meDoc); await addHistory(user.uid,'signup','Signup bonus',settings.signupBonus||50,0,null,'Paid'); if(referredBy){ await updateDoc(doc(db,'users',referredBy),{invites:increment(1),referralCredits:increment(settings.referralReward||50),creditsAvailable:increment(settings.referralReward||50)}); await addHistory(referredBy,'referral','Referral reward from '+meDoc.name,(settings.referralReward||50),0,null,'Paid'); }
 } else { meDoc={id:user.uid,...uref.data()}; if(meDoc.banned){ showModal('<h2>Account Banned</h2><p>Your account is banned.</p>'+supportHTML()); } }
 onSnapshot(doc(db,'users',user.uid),s=>{ if(s.exists()){meDoc={id:user.uid,...s.data()}; render();} });
 onSnapshot(query(collection(db,'completions'),where('earnerUid','==',user.uid)),s=>{completions=s.docs.map(d=>({id:d.id,...d.data()})); render();});
 onSnapshot(query(collection(db,'history'),where('uid','==',user.uid),orderBy('createdAt','desc'),limit(200)),s=>{myHistory=s.docs.map(d=>({id:d.id,...d.data()})); render();});
 onSnapshot(query(collection(db,'notifications'),where('uid','==',user.uid)),s=>{notifications=s.docs.map(d=>({id:d.id,...d.data()})); render();});
 onSnapshot(query(collection(db,'tickets'),where('uid','==',user.uid)),s=>{tickets=s.docs.map(d=>({id:d.id,...d.data()})); render();});
 onSnapshot(collection(db,'users'),s=>{usersCache=s.docs.map(d=>({id:d.id,...d.data()}));});
 await releasePending(); await autoApproveOwner(); render();
 }catch(e){ showErr('Could not load your account. If this is a Firestore permission error, set the Firestore rules from firestore.rules in the Firebase console, then reload. Error: '+e.message); if(meDoc){ render(); } else { $('page').innerHTML='<div class="card err">Could not load your account. Please reload the page. You are still signed in.</div>'; } } });
window.addEventListener('hashchange',render);
if(location.hash.startsWith('#/admin')) location.hash='#/loop';
render();
</script></body></html>
